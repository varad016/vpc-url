apiVersion: apps/v1
kind: Deployment
metadata:
  name: urls-deployment
  labels:
    app: urls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urls
  template:
    metadata:
      labels:
        app: urls
    spec:
      containers:
      - name: urls
        image: varadchopade/url-shortner:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: urls-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: urls-secret
              key: DB_PASSWORD
