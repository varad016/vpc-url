<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Shortener</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 80px auto; }
  input, button { padding: 10px; font-size: 14px; }
  input { width: 70%; }
  #result { margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
  <h2>URL Shortener</h2>
  <input id="url" placeholder="https://example.com/very/long/link" />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

<script>
async function shorten() {
  const url = document.getElementById('url').value;
  const res = await fetch('/api/shorten', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  const data = await res.json();
  document.getElementById('result').innerText = res.ok
    ? 'Short URL: ' + data.short_url
    : 'Error: ' + data.error;
}
</script>
</body>
</html>
